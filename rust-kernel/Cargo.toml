[package]
name = "factori-kernel"
version = "0.1.0"
edition = "2021"
description = "Deterministic integrity and bounded persistence kernel for fActorI"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
ryu = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }

[lib]
name = "factori_kernel"
path = "src/lib.rs"

[[bin]]
name = "factori-kernel"
path = "src/main.rs"
