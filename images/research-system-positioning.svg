<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual positioning of autonomous research systems</title>
  <desc id="desc">Google AI co-scientist, Sakana AI Scientist-v2, ScientistOne, and fActorI positioned by scientific autonomy and process or evidence governance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26323f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#fbfcfe"/>

  <text x="70" y="44" fill="#17212b" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Autonomous research systems</text>
  <text x="1130" y="44" text-anchor="end" fill="#66717d" font-family="Arial, Helvetica, sans-serif" font-size="17">Conceptual positioning, not a measured benchmark</text>

  <g stroke="#dbe1e7" stroke-width="1">
    <line x1="135" y1="425" x2="1100" y2="425"/>
    <line x1="135" y1="285" x2="1100" y2="285"/>
    <line x1="420" y1="565" x2="420" y2="80"/>
    <line x1="740" y1="565" x2="740" y2="80"/>
  </g>

  <g stroke="#26323f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="135" y1="565" x2="1110" y2="565"/>
    <line x1="135" y1="565" x2="135" y2="72"/>
  </g>

  <text x="1110" y="615" text-anchor="end" fill="#26323f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PROCESS / EVIDENCE GOVERNANCE</text>
  <text x="42" y="330" text-anchor="middle" transform="rotate(-90 42 330)" fill="#26323f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SCIENTIFIC AUTONOMY</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="205" y="465" width="270" height="78" rx="8" fill="#e6f1fb" stroke="#2d6f9f" stroke-width="2"/>
      <text x="340" y="495" text-anchor="middle" fill="#15496e" font-size="20" font-weight="700">Google AI co-scientist</text>
      <text x="340" y="522" text-anchor="middle" fill="#315c79" font-size="16">Collaborative hypothesis search</text>
    </g>

    <g>
      <rect x="235" y="320" width="255" height="78" rx="8" fill="#fff1cf" stroke="#b27607" stroke-width="2"/>
      <text x="362" y="350" text-anchor="middle" fill="#704a00" font-size="20" font-weight="700">AI Scientist-v2</text>
      <text x="362" y="377" text-anchor="middle" fill="#765a24" font-size="16">End-to-end paper production</text>
    </g>

    <g>
      <rect x="590" y="190" width="265" height="82" rx="8" fill="#e5f4ed" stroke="#24815d" stroke-width="2"/>
      <text x="722" y="222" text-anchor="middle" fill="#15583f" font-size="21" font-weight="700">ScientistOne</text>
      <text x="722" y="250" text-anchor="middle" fill="#326b57" font-size="16">Chain-of-Evidence</text>
    </g>

    <g>
      <rect x="870" y="105" width="245" height="88" rx="8" fill="#fbe8e5" stroke="#ae493c" stroke-width="2.5"/>
      <text x="992" y="138" text-anchor="middle" fill="#762d25" font-size="22" font-weight="700">fActorI</text>
      <text x="992" y="165" text-anchor="middle" fill="#7c463f" font-size="16">Search + evidence</text>
      <text x="992" y="184" text-anchor="middle" fill="#7c463f" font-size="16">+ branch provenance</text>
    </g>
  </g>
</svg>
